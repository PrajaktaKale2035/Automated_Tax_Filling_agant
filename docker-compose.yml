version: '3.8'

services:
  # Existing PostgreSQL - upgraded to pgvector for Phase 1 GraphRAG
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tax-agent-db
    environment:
      POSTGRES_USER: taxagent
      POSTGRES_PASSWORD: taxagent_secure_password_2024
      POSTGRES_DB: tax_filing_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxagent -d tax_filing_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tax-agent-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tax-agent-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taxagent.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - tax-agent-network

  # Neo4j Graph Database for Phase 1 GraphRAG (Knowledge Graph)
  neo4j:
    image: neo4j:5.15
    container_name: tax-neo4j
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/taxpassword123
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - tax-agent-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  tax-agent-network:
    driver: bridge
